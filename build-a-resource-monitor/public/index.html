<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resource Monitor</title>
  </head>
  <body>
    <h1>Resource Monitor</h1>
    <div id="status">Connecting...</div>
    <div class="grid">
      <div class="card">
        <h2>Memory Usage</h2>
        <div class="value"><span id="mem-usage">--</span>%</div>
        <div class="unit"><span id="free-mem">--</span> MB free / <span id="total-mem">--</span> MB total</div>
      </div>
      <div class="card">
        <h2>Load Average</h2>
        <div class="load-row">
          <div class="load-item"><div class="lv" id="load-1">--</div><div class="ll">1 min</div></div>
          <div class="load-item"><div class="lv" id="load-5">--</div><div class="ll">5 min</div></div>
          <div class="load-item"><div class="lv" id="load-15">--</div><div class="ll">15 min</div></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
